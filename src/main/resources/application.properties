spring.datasource.url=jdbc:postgresql://localhost:5432/modalink
spring.datasource.username=postgres
spring.datasource.password=postgres

# Producción (UC-67): usar el rol restringido creado por la migración.
# La API solo puede INSERT/SELECT sobre auditoria y detalle_auditoria.
# spring.datasource.username=${DB_API_USER:modalink_api}
# spring.datasource.password=${DB_API_PASSWORD:}

# JPA / Hibernate
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# El OSIV (open-in-view) mantiene el EntityManager abierto durante todo el
# request. En endpoints async como el SSE de presencia eso retiene una conexión
# JDBC hasta que termina el stream. La app devuelve DTOs, así que se desactiva.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

# HikariCP: límites explícitos para que un bloqueo no cuelgue todo el backend.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000

# Server
server.port=8080


#JJWT
jwt.secret=${JWT_SECRET:cambiar-este-valor-en-produccion-por-uno-largo-y-random}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# OAuth2 / Google (UC-09)
# Los valores por defecto permiten que la aplicacion arranque sin credenciales.
# Para probar el flujo real, definir GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Frontend / cookies
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

app.admin.correo=${ADMIN_EMAIL:admin@modalink.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.dni=${ADMIN_DNI:00000000}

# Multipart / Carga de archivos
# max-file-size: 10MB por imagen (moodboard: hasta 10 imagenes).
# max-request-size: 110MB para admitir un lote completo de 10 imagenes de 10MB en una sola peticion.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=110MB

# Almacenamiento local de archivos
# Cada tipo de imagen vive en su propio subdirectorio dentro de upload-dir.
app.storage.upload-dir=uploads
app.storage.perfiles-dir=perfiles
app.storage.moodboard-dir=moodboard
app.storage.publicaciones-dir=publicaciones
app.storage.polaroids-dir=polaroids

# Colaboraciones automáticas por coincidencia de imágenes
app.colaboracion-automatica.habilitada=true
app.colaboracion-automatica.phash-distancia-candidato=24
app.colaboracion-automatica.phash-distancia-alta-confianza=8
app.colaboracion-automatica.max-propuestas-por-imagen=10
app.colaboracion-automatica.orb-min-keypoints=50
app.colaboracion-automatica.orb-min-matches=50
app.colaboracion-automatica.orb-max-distancia=60
app.colaboracion-automatica.orb-max-distancia-inliers=40
app.colaboracion-automatica.multicrop-distancia-maxima=8
app.colaboracion-automatica.multicrop-grid=3
app.colaboracion-automatica.multicrop-escalas=90,80,70

# Detección asíncrona después del commit de la subida
app.colaboracion-automatica.async.core-pool-size=2
app.colaboracion-automatica.async.max-pool-size=4
app.colaboracion-automatica.async.queue-capacity=100
app.colaboracion-automatica.async.thread-name-prefix=colab-auto-
app.colaboracion-automatica.async.await-termination-seconds=60

# Procesamiento histórico administrativo (un solo worker)
app.colaboracion-automatica.historico.queue-capacity=10
app.colaboracion-automatica.historico.await-termination-seconds=120

# Polaroids de perfiles de modelo (maximo configurable; sin minimo)
app.polaroids.max-por-perfil=8

# Presencia por perfil (Mi red)
# El umbral debe ser mayor que el intervalo de heartbeat para tolerar un pulso perdido.
app.presencia.umbral-en-linea=120s
app.presencia.timeout-stream=5m
app.presencia.max-ids=200
app.presencia.intervalo-expiracion-ms=5000
app.presencia.intervalo-ping-ms=20000
app.presencia.scheduling-habilitado=true

# Mensajería privada (UC-42)
app.mensajeria.timeout-stream=30m
app.mensajeria.intervalo-ping-ms=20000
app.mensajeria.scheduling-habilitado=true

# Reprogramación automática de proyectos confirmados al cambiar la jornada
agenda.reprogramacion-automatica=true

# Reemplazo automático: máximo de candidatos propuestos por vacante
reemplazos.max-candidatos=20

# Reconciliación periódica de cronogramas (publicados y confirmados).
# Deshabilitada por defecto: usar una expresión cron para activarla.
agenda.reconciliacion-cronograma.cron=-
# false = solo detectar; true = mover también las actividades PENDIENTE reparables.
agenda.reconciliacion-cronograma.auto-reparar=false
# Máximo de proyectos procesados por ciclo.
agenda.reconciliacion-cronograma.limite=50

# Por si tengo problemas... descomentar
#logging.level.org.springframework.security=DEBUG

# -----------------------------------------------------------------------------
# Notificaciones por email (Mailpit en desarrollo)
# -----------------------------------------------------------------------------
# El scheduler esta deshabilitado por defecto para no afectar tests ni CI.
app.notificaciones.email.habilitado=${NOTIFICACIONES_EMAIL_HABILITADO:false}
app.notificaciones.email.remitente=${NOTIFICACIONES_EMAIL_REMITENTE:no-responder@modalink.local}

# Mailpit: http://localhost:8025, SMTP en localhost:1025.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000