spring.datasource.url=jdbc:postgresql://localhost:5432/modalink
spring.datasource.username=postgres
spring.datasource.password=postgres

# Producción (UC-67): usar el rol restringido creado por la migración.
# La API solo puede INSERT/SELECT sobre auditoria y detalle_auditoria.
# spring.datasource.username=${DB_API_USER:modalink_api}
# spring.datasource.password=${DB_API_PASSWORD:}

# JPA / Hibernate
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server
server.port=8080


#JJWT
jwt.secret=${JWT_SECRET:cambiar-este-valor-en-produccion-por-uno-largo-y-random}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# OAuth2 / Google (UC-09)
# Los valores por defecto permiten que la aplicacion arranque sin credenciales.
# Para probar el flujo real, definir GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# Frontend / cookies
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

app.admin.correo=${ADMIN_EMAIL:admin@modalink.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.dni=${ADMIN_DNI:00000000}

# Multipart / Carga de archivos
# max-file-size: 10MB por imagen (moodboard: hasta 10 imagenes).
# max-request-size: 110MB para admitir un lote completo de 10 imagenes de 10MB en una sola peticion.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=110MB

# Almacenamiento local de archivos
app.storage.upload-dir=uploads
app.storage.perfiles-dir=perfiles

# Reprogramación automática de proyectos confirmados al cambiar la jornada
agenda.reprogramacion-automatica=true

# Reemplazo automático: máximo de candidatos propuestos por vacante
reemplazos.max-candidatos=20

# Reconciliación periódica de cronogramas (publicados y confirmados).
# Deshabilitada por defecto: usar una expresión cron para activarla.
agenda.reconciliacion-cronograma.cron=-
# false = solo detectar; true = mover también las actividades PENDIENTE reparables.
agenda.reconciliacion-cronograma.auto-reparar=false
# Máximo de proyectos procesados por ciclo.
agenda.reconciliacion-cronograma.limite=50

