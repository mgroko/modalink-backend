spring.datasource.url=jdbc:postgresql://localhost:5432/modalink
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server
server.port=8080


#JJWT
jwt.secret=${JWT_SECRET:cambiar-este-valor-en-produccion-por-uno-largo-y-random}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.admin.correo=${ADMIN_EMAIL:admin@modalink.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.dni=${ADMIN_DNI:00000000}

# Multipart / Carga de archivos
# max-file-size: 10MB por imagen (moodboard: hasta 10 imagenes).
# max-request-size: 110MB para admitir un lote completo de 10 imagenes de 10MB en una sola peticion.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=110MB

# Almacenamiento local de archivos
app.storage.upload-dir=uploads
app.storage.perfiles-dir=perfiles

