name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Comprobar Docker y pre-descargar imágenes de test
        run: |
          docker version
          docker info
          for imagen in postgres:17-alpine axllent/mailpit:latest testcontainers/ryuk:0.12.0; do
            ok=0
            for intento in 1 2 3; do
              if docker pull "$imagen"; then
                ok=1
                break
              fi
              echo "Reintentando $imagen ($intento/3)..."
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "No se pudo descargar $imagen"
              exit 1
            fi
          done
      - run: mvn -B verify
