name: Tests
on: [push, pull_request]
jobs:
  test:
    # Testcontainers 1.21.3 is not compatible with the Docker version currently
    # shipped by the latest Ubuntu runner.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - run: mvn -B verify
